name: iOS ARM64 Gamecode Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-real-gamecode:
    name: Recompile Wind Waker HD for iPhone ARM64
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Google Drive downloader in an isolated environment
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/wwhd-venv"
          "$RUNNER_TEMP/wwhd-venv/bin/python" -m pip install --upgrade "gdown==6.5.1"

      - name: Download user-provided game archive
        env:
          DRIVE_FILE_ID: 1RjydKfJpv2WFLszhrSkzu7a2GqX40UuJ
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wwhd-input"
          "$RUNNER_TEMP/wwhd-venv/bin/gdown" --continue --retries 5 "https://drive.google.com/uc?id=$DRIVE_FILE_ID" \
            --output "$RUNNER_TEMP/wwhd-input/game.zip"
          test -s "$RUNNER_TEMP/wwhd-input/game.zip"
          du -h "$RUNNER_TEMP/wwhd-input/game.zip"

      - name: Extract RPX and verify USA version
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/wwhd-venv/bin/python" - <<'PY'
          import hashlib, os, zipfile
          archive = os.path.join(os.environ["RUNNER_TEMP"], "wwhd-input", "game.zip")
          expected = "c4f0ab300542e0bfc462696850534e71db2ad02288a7eb55e5a4cd4062f16153"
          suffix = "/code/cking.rpx"
          with zipfile.ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n.lower().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {suffix}; found {len(matches)}")
              target = os.path.join(os.environ["RUNNER_TEMP"], "wwhd-input", "cking.rpx")
              with z.open(matches[0]) as src, open(target, "wb") as dst:
                  while block := src.read(1024 * 1024):
                      dst.write(block)
          h = hashlib.sha256()
          with open(target, "rb") as f:
              for block in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(block)
          actual = h.hexdigest()
          print("RPX path:", matches[0])
          print("RPX bytes:", os.path.getsize(target))
          print("RPX SHA-256:", actual)
          if actual != expected:
              raise SystemExit("RPX hash does not match the expected USA base-game build")
          PY

      - name: Generate real game C sources
        run: |
          set -euo pipefail
          RPX="$RUNNER_TEMP/wwhd-input/cking.rpx"
          OUT="$RUNNER_TEMP/wwhd-generated-code"
          "$RUNNER_TEMP/wwhd-venv/bin/python" -u tools/recomp/recomp.py "$RPX" "$OUT"
          test -s "$OUT/funcs.h"
          test -s "$OUT/table.c"
          test -s "$OUT/imports.c"
          test -s "$OUT/report.txt"
          COUNT="$(find "$OUT" -maxdepth 1 -type f -name 'code_*.c' | wc -l | tr -d ' ')"
          test "$COUNT" -gt 0
          echo "Generated game C files: $COUNT"
          du -sh "$OUT"
          cat "$OUT/report.txt"

      - name: Compile actual gamecode for iOS arm64
        env:
          OUT: ${{ runner.temp }}/wwhd-generated-code
          OBJ: ${{ runner.temp }}/wwhd-ios-arm64-objects
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "iPhoneOS SDK: $SDK"
          xcrun --sdk iphoneos clang --version
          mkdir -p "$OBJ"
          export SDK OUT OBJ
          find "$OUT" -maxdepth 1 -type f \
            \( -name 'code_*.c' -o -name 'table.c' -o -name 'imports.c' \) -print0 |
            xargs -0 -n 1 -P 4 bash -c '
              set -euo pipefail
              SRC="$1"
              NAME="$(basename "$SRC" .c)"
              xcrun --sdk iphoneos clang \
                -target arm64-apple-ios15.0 \
                -isysroot "$SDK" \
                -std=c11 -O3 -fwrapv -fno-strict-aliasing -ffp-contract=off -w \
                -Iruntime/include -I"$OUT" \
                -c "$SRC" -o "$OBJ/$NAME.o"
            ' _
          OBJECTS="$(find "$OBJ" -maxdepth 1 -type f -name '*.o' | wc -l | tr -d ' ')"
          test "$OBJECTS" -ge 3
          echo "Compiled iOS ARM64 objects: $OBJECTS"
          /usr/bin/libtool -static -o "$OBJ/libwwhd_gamecode_ios.a" "$OBJ"/*.o
          test -s "$OBJ/libwwhd_gamecode_ios.a"
          lipo -info "$OBJ/libwwhd_gamecode_ios.a"
          du -h "$OBJ/libwwhd_gamecode_ios.a"

      - name: Confirm generated game data stayed on the ephemeral runner
        run: |
          echo "PASS: real gamecode compiled for arm64-apple-ios15.0."
          echo "No RPX, generated game code, object files, static archive, or IPA was uploaded."
