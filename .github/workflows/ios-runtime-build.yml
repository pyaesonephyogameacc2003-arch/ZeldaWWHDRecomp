name: iOS ARM64 Runtime Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/WindowsDependencies.cmake'
      - 'runtime/src/main.cpp'
      - 'runtime/src/core.cpp'
      - 'runtime/include/ppc.h'
      - 'runtime/src/platform/keycodes.h'
      - 'runtime/src/platform/process.h'
      - 'runtime/src/gfx/vulkan/graphics_menu_ios.cpp'
      - 'runtime/src/platform/ios_host.mm'
      - 'runtime/src/platform/touch_pad.cpp'
      - 'runtime/src/platform/touch_pad.h'
      - 'runtime/src/overlay/overlay.cpp'
      - 'runtime/src/gfx/vulkan/backend.cpp'
      - 'ios/**'
      - '.github/workflows/ios-runtime-build.yml'

permissions:
  contents: read

jobs:
  build-ios-app:
    name: Build Wind Waker HD iOS app bundle
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Build the exact commit that triggered this run; do not silently use main.
          ref: ${{ github.sha }}

      - name: Install isolated game archive downloader
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/wwhd-venv"
          "$RUNNER_TEMP/wwhd-venv/bin/python" -m pip install --upgrade "gdown==6.5.1"
