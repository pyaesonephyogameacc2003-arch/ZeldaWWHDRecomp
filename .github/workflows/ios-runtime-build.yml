name: iOS ARM64 Runtime Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'cmake/WindowsDependencies.cmake'
      - 'CMakeLists.txt'
      - 'runtime/src/main.cpp'
      - 'runtime/src/core.cpp'
      - 'runtime/include/ppc.h'
      - 'runtime/src/platform/keycodes.h'
      - 'runtime/src/platform/process.h'
      - 'runtime/src/gfx/vulkan/graphics_menu_ios.cpp'
      - 'runtime/src/platform/ios_host.mm'
      - 'runtime/src/platform/touch_pad.cpp'
      - 'runtime/src/platform/touch_pad.h'
      - 'runtime/src/overlay/overlay.cpp'
      - 'runtime/src/gfx/vulkan/backend.cpp'
      - 'ios/**'
      - '.github/workflows/ios-runtime-build.yml'

permissions:
  contents: read

jobs:
  build-ios-app:
    name: Build Wind Waker HD iOS app bundle
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          # Build the exact commit that triggered this run; do not silently use main.
          ref: ${{ github.sha }}

      - name: Install isolated game archive downloader
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/wwhd-venv"
          "$RUNNER_TEMP/wwhd-venv/bin/python" -m pip install --upgrade "gdown==6.5.1"

      - name: Download and verify user-provided USA game archive
        env:
          DRIVE_FILE_ID: 1RjydKfJpv2WFLszhrSkzu7a2GqX40UuJ
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wwhd-input"
          "$RUNNER_TEMP/wwhd-venv/bin/gdown" --continue --retries 5 "https://drive.google.com/uc?id=$DRIVE_FILE_ID" \
            --output "$RUNNER_TEMP/wwhd-input/game.zip"
          "$RUNNER_TEMP/wwhd-venv/bin/python" - <<'PY'
          import hashlib, os, zipfile
          archive = os.path.join(os.environ["RUNNER_TEMP"], "wwhd-input", "game.zip")
          expected = "c4f0ab300542e0bfc462696850534e71db2ad02288a7eb55e5a4cd4062f16153"
          suffix = "/code/cking.rpx"
          with zipfile.ZipFile(archive) as z:
              matches = [n for n in z.namelist() if n.lower().endswith(suffix)]
              if len(matches) != 1:
                  raise SystemExit(f"Expected exactly one {suffix}; found {len(matches)}")
              target = os.path.join(os.environ["RUNNER_TEMP"], "wwhd-input", "cking.rpx")
              with z.open(matches[0]) as src, open(target, "wb") as dst:
                  while block := src.read(1024 * 1024):
                      dst.write(block)
          h = hashlib.sha256()
          with open(target, "rb") as f:
              for block in iter(lambda: f.read(1024 * 1024), b""):
                  h.update(block)
          actual = h.hexdigest()
          print("RPX SHA-256:", actual)
          if actual != expected:
              raise SystemExit("The archive does not contain the expected USA base-game RPX")
          PY

      - name: Generate actual recompiled game sources
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/wwhd-generated-code"
          "$RUNNER_TEMP/wwhd-venv/bin/python" -u tools/recomp/recomp.py "$RUNNER_TEMP/wwhd-input/cking.rpx" "$OUT"
          test -s "$OUT/funcs.h"
          test -s "$OUT/table.c"
          test -s "$OUT/imports.c"
          test -s "$OUT/report.txt"
          COUNT="$(find "$OUT" -maxdepth 1 -type f -name 'code_*.c' | wc -l | tr -d ' ')"
          test "$COUNT" -gt 0
          echo "Generated source files: $COUNT"
          du -sh "$OUT"
          cat "$OUT/report.txt"

      - name: Checkout pinned MoltenVK source
        uses: actions/checkout@v4
        with:
          repository: KhronosGroup/MoltenVK
          ref: 5189f8de86ec365860f63bf1da736815cfaea5cd
          path: MoltenVK

      - name: Build static MoltenVK for iOS
        working-directory: MoltenVK
        run: |
          set -euo pipefail
          ./fetchDependencies --ios
          xcodebuild build -quiet \
            -project MoltenVKPackaging.xcodeproj \
            -scheme "MoltenVK Package (iOS only)" \
            -configuration Release

      - name: Verify iOS MoltenVK slice
        run: |
          set -euo pipefail
          XC="$GITHUB_WORKSPACE/MoltenVK/Package/Release/MoltenVK/static/MoltenVK.xcframework"
          INC="$GITHUB_WORKSPACE/MoltenVK/Package/Release/MoltenVK/include"
          test -s "$XC/ios-arm64/libMoltenVK.a"
          test -s "$INC/vulkan/vulkan.h"
          lipo -info "$XC/ios-arm64/libMoltenVK.a"

      - name: Checkout pinned SDL3 source (avoid release-asset 504)
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.4.18
          path: SDL3-source

      - name: Configure iOS app bundle (retry transient dependency downloads)
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            echo "CMake configure attempt $attempt/4"
            if cmake -S . -B build/ios -G Ninja \
              -DCMAKE_SYSTEM_NAME=iOS \
              -DCMAKE_OSX_SYSROOT=iphoneos \
              -DCMAKE_OSX_ARCHITECTURES=arm64 \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
              -DCMAKE_BUILD_TYPE=Release \
              -DGEN_DIR="$RUNNER_TEMP/wwhd-generated-code" \
              -DWWHD_RENDERER=VULKAN \
              -DFETCHCONTENT_SOURCE_DIR_SDL3="$GITHUB_WORKSPACE/SDL3-source" \
              -DWWHD_BUNDLED_DEPS=ON \
              -DWWHD_BUNDLED_ZSTD=ON \
              -DWWHD_EDITOR_MCP=OFF \
              -DWWHD_IOS_MOLTENVK_XCFRAMEWORK="$GITHUB_WORKSPACE/MoltenVK/Package/Release/MoltenVK/static/MoltenVK.xcframework" \
              -DWWHD_IOS_MOLTENVK_INCLUDE_DIR="$GITHUB_WORKSPACE/MoltenVK/Package/Release/MoltenVK/include" \
              -DWWHD_IOS_BUNDLE_ID=com.pyaesonephyogameacc2003.wwhd \
              -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO; then
              echo "CMake configure succeeded."
              break
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "::error::CMake configure failed after 4 attempts."
              exit 1
            fi
            echo "Configure failed; retrying after 20 seconds (likely transient dependency download failure)."
            sleep 20
          done

      - name: Compile the complete iOS app target
        run: |
          set -euo pipefail
          cmake --build build/ios --config Release --target wwhd --parallel 4

      - name: Validate unsigned iOS app bundle
        run: |
          set -euo pipefail
          APP="build/ios/wwhd.app"
          echo "Checking application bundle: $APP"
          test -d "$APP"
          test -s "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :UIFileSharingEnabled true' "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :UIFileSharingEnabled bool true' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :LSSupportsOpeningDocumentsInPlace true' "$APP/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c 'Add :LSSupportsOpeningDocumentsInPlace bool true' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :UIFileSharingEnabled' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :LSSupportsOpeningDocumentsInPlace' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          BIN="$APP/$EXECUTABLE"
          echo "Detected executable: $BIN"
          ls -la "$APP"
          test -s "$BIN"
          chmod 755 "$BIN"
          test -x "$BIN"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          file "$BIN"
          lipo -info "$BIN"
          if otool -L "$BIN" | grep -q 'AppKit.framework'; then
            echo "ERROR: macOS AppKit leaked into the iOS app link"
            exit 1
          fi
          echo "PASS: unsigned iOS arm64 .app bundle compiled and validated."
          echo "The app bundle remains on the ephemeral runner; no game code or IPA is uploaded."

      - name: Package and validate unsigned IPA (ephemeral only)
        run: |
          set -euo pipefail
          APP="build/ios/wwhd.app"
          OUT="$RUNNER_TEMP/wwhd-ipa-check"
          IPA="$OUT/Wind-Waker-HD-unsigned.ipa"
          rm -rf "$OUT"
          mkdir -p "$OUT/Payload"
          ditto "$APP" "$OUT/Payload/wwhd.app"
          (cd "$OUT" && /usr/bin/zip -qry "$IPA" Payload)
          test -s "$IPA"
          /usr/bin/unzip -t "$IPA"
          /usr/bin/unzip -Z1 "$IPA" | grep -Fxq 'Payload/wwhd.app/Info.plist'
          /usr/bin/unzip -Z1 "$IPA" | grep -Fxq 'Payload/wwhd.app/wwhd'
          echo "PASS: unsigned IPA package structure validated."
          du -h "$IPA"
          echo "IPA intentionally not uploaded; runner cleanup removes it after this job."

      - name: Encrypt IPA for artifact download
        id: encrypt_ipa
        env:
          IPA_ARTIFACT_PASSWORD: ${{ secrets.IPA_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$IPA_ARTIFACT_PASSWORD" ]; then
            echo "::warning::Set repository Actions secret IPA_ARTIFACT_PASSWORD to enable encrypted IPA artifact."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${#IPA_ARTIFACT_PASSWORD}" -lt 20 ]; then
            echo "IPA_ARTIFACT_PASSWORD must be at least 20 characters."
            exit 1
          fi
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/wwhd-ipa-check/Wind-Waker-HD-unsigned.ipa" \
            -out "$RUNNER_TEMP/Wind-Waker-HD-unsigned.ipa.enc" \
            -pass env:IPA_ARTIFACT_PASSWORD
          test -s "$RUNNER_TEMP/Wind-Waker-HD-unsigned.ipa.enc"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Encrypted IPA is ready for a short-lived artifact."

      - name: Decrypt IPA immediately after build
        if: steps.encrypt_ipa.outputs.ready == 'true'
        env:
          IPA_ARTIFACT_PASSWORD: ${{ secrets.IPA_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/Wind-Waker-HD-unsigned.ipa.enc" \
            -out "$RUNNER_TEMP/Wind-Waker-HD-decrypted.ipa" \
            -pass env:IPA_ARTIFACT_PASSWORD
          test -s "$RUNNER_TEMP/Wind-Waker-HD-decrypted.ipa"
          /usr/bin/unzip -tq "$RUNNER_TEMP/Wind-Waker-HD-decrypted.ipa"
          python3 - "$RUNNER_TEMP/Wind-Waker-HD-decrypted.ipa" <<'PY'
          import plistlib, sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              apps = [n for n in z.namelist()
                      if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              if not apps:
                  raise SystemExit("Decrypted IPA has no Payload/*.app/Info.plist")
              for name in apps:
                  info = plistlib.loads(z.read(name))
                  exe = info.get("CFBundleExecutable")
                  binary = name.rsplit("/", 1)[0] + "/" + exe if exe else ""
                  if not binary or binary not in z.namelist():
                      raise SystemExit(f"Missing app executable for {name}")
                  print("Validated:", info.get("CFBundleIdentifier"), "executable:", exe)
          print("PASS: decrypted IPA validated.")
          PY
          ls -lh "$RUNNER_TEMP/Wind-Waker-HD-decrypted.ipa"

      - name: Upload decrypted IPA artifact
        if: steps.encrypt_ipa.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Wind-Waker-HD-iOS-decrypted-IPA
          path: ${{ runner.temp }}/Wind-Waker-HD-decrypted.ipa
          if-no-files-found: error
          retention-days: 3
