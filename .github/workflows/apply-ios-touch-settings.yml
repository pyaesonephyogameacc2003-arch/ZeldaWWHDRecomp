name: Apply iOS touch Settings patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-ios-touch-settings.yml
      - tools/ios_touch_settings_patch.py

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch and push
        run: |
          set -euo pipefail
          python3 tools/ios_touch_settings_patch.py
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add runtime/src/platform/touch_pad.cpp runtime/src/gfx/vulkan/backend.cpp
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "iOS: Settings button on touch pad; fix finger window routing"
          git push origin HEAD:main

      - name: Remove this workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          rm -f .github/workflows/apply-ios-touch-settings.yml
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add .github/workflows/apply-ios-touch-settings.yml
          git commit -m "ci: remove touch settings apply workflow" || exit 0
          git push origin HEAD:main || true
