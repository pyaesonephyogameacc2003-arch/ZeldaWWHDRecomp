name: Restore iOS MoltenVK fix
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-ios-moltenvk.yml
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          set -euo pipefail
          GOOD=12adb261688b1af088710927eb0bbea2f6f5b87f
          git checkout "$GOOD" -- CMakeLists.txt runtime/src/gfx/vulkan/backend.cpp
          python3 -c "import pathlib,base64; pathlib.Path('/tmp/p.py').write_bytes(base64.b64decode(open('/tmp/b64').read()))"
          # inline base64 file
          cat > /tmp/b64 << 'B64'

B64
          python3 -c "import pathlib,base64; pathlib.Path('/tmp/p.py').write_bytes(base64.b64decode(pathlib.Path('/tmp/b64').read_text()))"
          # simpler: just restore files without patch first
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          # Apply cmake-only via python one-liner
          python3 -c "from pathlib import Path;c=Path('CMakeLists.txt').read_text();o='target_link_libraries(wwhd PRIVATE \"${WWHD_IOS_MOLTENVK_ARCHIVE}\" glslang';n='target_link_options(wwhd PRIVATE \"LINKER:-force_load,${WWHD_IOS_MOLTENVK_ARCHIVE}\")\\n    target_link_libraries(wwhd PRIVATE glslang';
assert o in c; Path('CMakeLists.txt').write_text(c.replace(o,n,1)); print('cmake ok')"
          git add CMakeLists.txt runtime/src/gfx/vulkan/backend.cpp
          git commit -m "iOS: restore CMakeLists/backend; force-load MoltenVK"
          git push origin HEAD:main
