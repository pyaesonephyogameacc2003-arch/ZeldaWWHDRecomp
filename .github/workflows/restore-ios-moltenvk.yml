name: Restore iOS MoltenVK fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/restore-ios-moltenvk.yml
      - tools/ios_moltenvk_patch.py

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply iOS MoltenVK patch
        run: |
          set -euo pipefail
          python3 tools/ios_moltenvk_patch.py
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add CMakeLists.txt runtime/src/gfx/vulkan/backend.cpp
          if git diff --cached --quiet; then
            echo "No file changes to commit"
          else
            git commit -m "iOS: force-load static MoltenVK and load from app image"
            git push origin HEAD:main
          fi

      - name: Remove temporary restore workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          if [ -f .github/workflows/restore-ios-moltenvk.yml ]; then
            rm -f .github/workflows/restore-ios-moltenvk.yml
            git config user.name "pyaesonephyogameacc2003-arch"
            git config user.email "pyaesonephyogameacc2003@gmail.com"
            git add .github/workflows/restore-ios-moltenvk.yml
            git commit -m "ci: remove temporary restore workflow" || exit 0
            git push origin HEAD:main || true
          fi
