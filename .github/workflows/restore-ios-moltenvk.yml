name: Restore iOS MoltenVK fix
on:
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore files from last good commit and apply fix
        run: |
          set -euo pipefail
          GOOD=12adb261688b1af088710927eb0bbea2f6f5b87f
          git checkout "$GOOD" -- CMakeLists.txt runtime/src/gfx/vulkan/backend.cpp

          python3 <<'PY'
          from pathlib import Path

          cmake = Path("CMakeLists.txt").read_text()
          old = '''    target_include_directories(wwhd SYSTEM PRIVATE "${WWHD_IOS_MOLTENVK_INCLUDE_DIR}")
    target_compile_definitions(wwhd PRIVATE WWHD_IOS_STATIC_MOLTENVK=1)
    target_link_libraries(wwhd PRIVATE "${WWHD_IOS_MOLTENVK_ARCHIVE}" glslang::glslang glslang::SPIRV glslang::glslang-default-resource-limits)'''
          new = '''    target_include_directories(wwhd SYSTEM PRIVATE "${WWHD_IOS_MOLTENVK_INCLUDE_DIR}")
    target_compile_definitions(wwhd PRIVATE WWHD_IOS_STATIC_MOLTENVK=1)
    # force_load: keep MoltenVK entry points in the app image so they are not
    # dead-stripped (nothing calls them by symbol at link time; SDL/dlsym looks
    # them up at runtime). Required for SDL_Vulkan_LoadLibrary on the main binary.
    target_link_options(wwhd PRIVATE "LINKER:-force_load,${WWHD_IOS_MOLTENVK_ARCHIVE}")
    target_link_libraries(wwhd PRIVATE glslang::glslang glslang::SPIRV glslang::glslang-default-resource-limits)'''
          if old not in cmake:
              raise SystemExit("cmake pattern missing")
          Path("CMakeLists.txt").write_text(cmake.replace(old, new, 1))

          backend = Path("runtime/src/gfx/vulkan/backend.cpp").read_text()
          old_inc = '''#ifdef WWHD_SDL_HOST
#include "platform/input_sdl.h"
#include "overlay/window_target.h"
#include <SDL3/SDL_vulkan.h>
#endif'''
          new_inc = '''#ifdef WWHD_SDL_HOST
#include "platform/input_sdl.h"
#include "overlay/window_target.h"
#include <SDL3/SDL_vulkan.h>
#if defined(WWHD_IOS_STATIC_MOLTENVK)
#include <dlfcn.h>
#include <mach-o/dyld.h>
#endif
#endif'''
          if old_inc not in backend:
              raise SystemExit("backend include pattern missing")
          backend = backend.replace(old_inc, new_inc, 1)

          old_load = '''  // the Vulkan loader (vulkan-1.dll, libvulkan.so.1), loaded here rather than imported (loader.h); the
  // windows below use the same one
  // SDL's Apple loader searches all Mach-O images for vkGetInstanceProcAddr. With
  // static MoltenVK linked into the iOS app, this initializes SDL's Vulkan state
  // without trying to dlopen a nonexistent libMoltenVK.dylib.
  if (!SDL_Vulkan_LoadLibrary(nullptr))
    exception_report::raise(std::string("Vulkan is not installed on this computer: the Vulkan runtime "
#ifdef _WIN32
                                         "(vulkan-1.dll) "
#endif
                                         "could not be loaded (") + SDL_GetError() + ").\\n\\n" + kUpdateDriver);
  auto gipa = reinterpret_cast<PFN_vkGetInstanceProcAddr>(SDL_Vulkan_GetVkGetInstanceProcAddr());
#ifdef __ANDROID__
  if (auto custom = drivers::open_custom()) gipa = custom;
#endif
  load_global_functions(gipa);'''
          new_load = '''  // the Vulkan loader (vulkan-1.dll, libvulkan.so.1), loaded here rather than imported (loader.h); the
  // windows below use the same one
#if defined(WWHD_IOS_STATIC_MOLTENVK)
  // iOS: MoltenVK is linked statically into the app (no libMoltenVK.dylib, no
  // system Vulkan loader). SDL_Vulkan_LoadLibrary(nullptr) only dlopens dylib
  // names and reports "Failed to load Vulkan Portability library". Point SDL at
  // the main executable image instead, where force_load kept the MoltenVK
  // entry points. Fall back to dlsym(RTLD_DEFAULT) if needed.
  {
    char exePath[4096];
    uint32_t exeSize = sizeof(exePath);
    const char *loadPath = nullptr;
    if (_NSGetExecutablePath(exePath, &exeSize) == 0)
      loadPath = exePath;
    if (!SDL_Vulkan_LoadLibrary(loadPath)) {
      auto gipaDlsym = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(RTLD_DEFAULT, "vkGetInstanceProcAddr"));
      if (!gipaDlsym) {
        exception_report::raise(std::string("iOS static MoltenVK: Vulkan entry points not found (") +
                                SDL_GetError() + "). The app was built without force-loaded MoltenVK.");
      }
      LOG("[vulkan] SDL_Vulkan_LoadLibrary failed (%s); using static MoltenVK via dlsym", SDL_GetError());
      load_global_functions(gipaDlsym);
    } else {
      auto gipa = reinterpret_cast<PFN_vkGetInstanceProcAddr>(SDL_Vulkan_GetVkGetInstanceProcAddr());
      if (!gipa)
        gipa = reinterpret_cast<PFN_vkGetInstanceProcAddr>(dlsym(RTLD_DEFAULT, "vkGetInstanceProcAddr"));
      if (!gipa)
        exception_report::raise("iOS static MoltenVK: vkGetInstanceProcAddr is null after load");
      LOG("[vulkan] loader: static MoltenVK in app image");
      load_global_functions(gipa);
    }
  }
#else
  // SDL's Apple loader searches all Mach-O images for vkGetInstanceProcAddr. With
  // static MoltenVK linked into the iOS app, this initializes SDL's Vulkan state
  // without trying to dlopen a nonexistent libMoltenVK.dylib.
  if (!SDL_Vulkan_LoadLibrary(nullptr))
    exception_report::raise(std::string("Vulkan is not installed on this computer: the Vulkan runtime "
#ifdef _WIN32
                                         "(vulkan-1.dll) "
#endif
                                         "could not be loaded (") + SDL_GetError() + ").\\n\\n" + kUpdateDriver);
  auto gipa = reinterpret_cast<PFN_vkGetInstanceProcAddr>(SDL_Vulkan_GetVkGetInstanceProcAddr());
#ifdef __ANDROID__
  if (auto custom = drivers::open_custom()) gipa = custom;
#endif
  load_global_functions(gipa);
#endif'''
          # Fix accidental double-escaping of newlines in the exception string
          new_load = new_load.replace(').\\\\n\\\\n"', ').\\n\\n"')
          old_load = old_load.replace(').\\\\n\\\\n"', ').\\n\\n"')
          if old_load not in backend:
              # try with single-escaped form matching the repo
              old_load2 = old_load.replace(').\\n\\n"', ').\n\n"')
              new_load2 = new_load.replace(').\\n\\n"', ').\n\n"')
              if old_load2 in backend:
                  backend = backend.replace(old_load2, new_load2, 1)
              else:
                  raise SystemExit("backend load pattern missing")
          else:
              backend = backend.replace(old_load, new_load, 1)
          Path("runtime/src/gfx/vulkan/backend.cpp").write_text(backend)
          print("patched ok")
          PY

          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add CMakeLists.txt runtime/src/gfx/vulkan/backend.cpp
          git commit -m "iOS: force-load static MoltenVK and load from app image"
          git push origin HEAD:main

      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git pull --rebase origin main
          rm -f .github/workflows/restore-ios-moltenvk.yml
          git add .github/workflows/restore-ios-moltenvk.yml
          git commit -m "ci: remove temporary restore workflow" || exit 0
          git push origin HEAD:main || true
