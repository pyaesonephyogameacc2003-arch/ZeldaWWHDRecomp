name: Apply iOS single-window patch

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-ios-single-window.yml
      - tools/ios_single_window_patch.py

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch and push
        run: |
          set -euo pipefail
          python3 tools/ios_single_window_patch.py
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add runtime/src/gfx/vulkan/backend.cpp
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "iOS: disable on-demand GamePad SDL window"
          git push origin HEAD:main

      - name: Remove this workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          rm -f .github/workflows/apply-ios-single-window.yml
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add .github/workflows/apply-ios-single-window.yml
          git commit -m "ci: remove single-window apply workflow" || exit 0
          git push origin HEAD:main || true
