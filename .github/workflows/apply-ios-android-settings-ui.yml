name: Apply iOS Android Settings UI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-ios-android-settings-ui.yml
      - tools/ios_android_settings_ui_patch.py

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch and push
        run: |
          set -euo pipefail
          python3 tools/ios_android_settings_ui_patch.py
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add runtime/src/overlay/overlay.cpp runtime/src/gfx/vulkan/backend.cpp runtime/src/platform/touch_pad.cpp
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "iOS: Android-style Settings UI (mobile_ui phone layout + DPI)"
          git push origin HEAD:main

      - name: Remove this workflow
        run: |
          set -euo pipefail
          git pull --rebase origin main || true
          rm -f .github/workflows/apply-ios-android-settings-ui.yml
          git config user.name "pyaesonephyogameacc2003-arch"
          git config user.email "pyaesonephyogameacc2003@gmail.com"
          git add .github/workflows/apply-ios-android-settings-ui.yml
          git commit -m "ci: remove android-settings-ui apply workflow" || exit 0
          git push origin HEAD:main || true
